<html lang="pt-BR">

<title>MTraining</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: cabeçalho, trilho de categorias, plano do dia em lista de cartões, ficha do exercício em painel inferior. */
:root{
  --accent:#2dff7a; --accent-ink:#04110a;
  --bg:#070a0f;
  --surface:color-mix(in srgb,var(--accent) 5%,#111720);
  --surface2:color-mix(in srgb,var(--accent) 9%,#1a212b);
  --ink:#f1f5f9; --muted:#9ba8b7;
  --line:color-mix(in srgb,var(--accent) 16%,#232c37);
  --fig:#f1f5f9; --fig2:#5d6b7c;
  --glow:color-mix(in srgb,var(--accent) 55%,transparent);
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(900px 440px at 90% -120px,color-mix(in srgb,var(--accent) 24%,transparent),transparent 70%),radial-gradient(640px 420px at -15% 28%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 70%),var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:110px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:env(safe-area-inset-top) 16px 0}
header.top{padding:22px 0 10px}
.brand{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0}
.brand span{color:var(--accent);text-shadow:0 0 18px var(--glow),0 0 2px var(--accent)}
.by{margin:4px 0 0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.themes{display:flex;gap:10px;margin-top:14px;align-items:center}
.themes small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 70%,transparent);padding:0}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 18px var(--c)}
.sub{margin:6px 0 0;color:var(--muted);max-width:46ch}

.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;margin:0 -16px;scroll-snap-type:x proximity;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 18px var(--glow)}
.chip[aria-pressed="true"] i{background:var(--accent-ink)}

.hero{border-left:6px solid var(--accent);box-shadow:-6px 0 20px -8px var(--glow);background:var(--surface);border-radius:4px 12px 12px 4px;padding:14px 16px;margin-top:6px}
.hero h2{font-family:var(--display);font-size:30px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.01em}
.hero p{margin:6px 0 0;color:var(--muted)}

.seg{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px -2px var(--glow)}

.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
.meta div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.meta b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.meta span{font-weight:600;font-size:15px;line-height:1.25;display:block;margin-top:2px}
.note{margin:12px 0 0;color:var(--muted);font-size:15px}

.days{display:flex;gap:6px;margin:18px 0 0;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:1 0 auto;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-width:120px}
.days button b{display:block;font-family:var(--display);font-size:20px;line-height:1.1;text-transform:uppercase}
.days button small{display:block;color:var(--muted);font-size:13px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 18px var(--glow)}
.days button[aria-pressed="true"] small{color:var(--accent-ink);opacity:.8}

.prog{display:flex;align-items:center;gap:12px;margin:16px 0 8px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);box-shadow:0 0 10px var(--glow);width:0;transition:width .3s}
.prog span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog button{border:0;background:none;text-decoration:underline;color:var(--muted);font-size:14px;padding:4px}

ol.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card .open{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:8px 8px 8px 8px}
.thumb{background:var(--surface2);border-radius:8px;aspect-ratio:220/160;overflow:hidden}
.thumb svg,.stage svg,.frame svg{display:block;width:100%;height:100%}
.card h3{margin:0;font-size:17px;line-height:1.2;font-weight:600}
.card .rx{margin:3px 0 0;font-family:var(--display);font-weight:700;font-size:22px;line-height:1;color:var(--accent);text-shadow:0 0 12px var(--glow);font-variant-numeric:tabular-nums}
.card .rx small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.card .mus{margin:4px 0 0;font-size:13px;color:var(--muted)}
.check{width:56px;border:0;border-left:1px solid var(--line);background:none;display:grid;place-items:center}
.check span{width:26px;height:26px;border-radius:8px;border:2px solid var(--fig2);display:grid;place-items:center}
.check svg{width:16px;height:16px;opacity:0}
.card.done .check span{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--glow)}
.card.done .check svg{opacity:1;stroke:var(--accent-ink)}
.card.done h3{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.65}

footer{margin:28px 0 0;color:var(--muted);font-size:14px;max-width:60ch}

/* ficha do exercício */
#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(5,10,8,.55)}
.panel{border-top:2px solid var(--accent);position:relative;width:100%;max-width:760px;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px 120px;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ph h2{font-family:var(--display);font-size:32px;line-height:1.05;margin:0;text-transform:uppercase}
.x{flex:0 0 auto;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.stage{position:relative;margin-top:12px;background:var(--surface);border:1px solid var(--accent);box-shadow:0 0 22px -6px var(--glow);border-radius:14px;aspect-ratio:220/160;overflow:hidden}
.play{position:absolute;right:10px;bottom:10px;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 12px;font-size:14px;font-weight:600}
.frames{display:flex;gap:8px;margin-top:8px}
.frame{flex:1;max-width:140px}
.frame .img{background:var(--surface);border:1px solid var(--line);border-radius:8px;aspect-ratio:220/160;overflow:hidden}
.frame small{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tags span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:14px}
.tags .rxp{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 0 14px var(--glow)}
.panel h4{font-family:var(--display);text-transform:uppercase;font-size:20px;letter-spacing:.03em;margin:18px 0 6px}
.panel ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.err{margin-top:14px;border-left:4px solid var(--accent);background:var(--surface);padding:10px 12px;border-radius:0 10px 10px 0}
.err b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:11px 16px;font-weight:600;text-decoration:none;border:1.5px solid var(--line);background:var(--surface)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 18px var(--glow)}
.btn.on{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px -2px var(--glow)}

/* cronômetro de descanso */
#timer{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
#timer .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
#timer .lab{font-family:var(--display);text-transform:uppercase;font-weight:700;font-size:18px;margin-right:auto}
#timer button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 11px;font-weight:600;font-size:14px}
#timer .clock{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;color:var(--accent);text-shadow:0 0 14px var(--glow);font-variant-numeric:tabular-nums;margin-right:auto}
#timer.run .pick{display:none}
#timer:not(.run) .clock,#timer:not(.run) .skip{display:none}
@media (prefers-reduced-motion: reduce){ .bar i{transition:none} }
@media (max-width:400px){ .card .open{grid-template-columns:88px 1fr} .meta span{font-size:14px} }
</style>
</head>

</div>

const NS='http://www.w3.org/2000/svg';
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function sv(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
const pts=(...a)=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const lerp=(a,b,t)=>{const o={};for(const k in a)o[k]=[a[k][0]+(b[k][0]-a[k][0])*t,a[k][1]+(b[k][1]-a[k][1])*t];return o};
function poseAt(fr,v){const n=fr.length;if(n===1)return fr[0];const i=Math.min(Math.floor(v),n-2);let f=Math.min(1,Math.max(0,(v-i)*1.5-.25));f=f*f*(3-2*f);return lerp(fr[i],fr[i+1],f)}
function vAt(ts,n){const per=(n-1)*2,u=(ts/1000)%per;return u<=n-1?u:per-u}

  if(d.includes('hang'))sv('line',Object.assign({x1:84,y1:14,x2:152,y2:14},st('var(--accent)',4)),svg);
  if(d.includes('platform'))sv('line',Object.assign({x1:154,y1:64,x2:154,y2:120},st('var(--accent)',6)),svg);
  const cableTop=d.includes('cable')||d.includes('cableTop')?sv('line',Object.assign({x1:130,y1:0,x2:130,y2:0},st('var(--fig2)',1.6)),svg):null;
  const cableH=d.includes('cableH')?sv('line',Object.assign({x1:0,y1:0,x2:210,y2:0},st('var(--fig2)',1.6)),svg):null;
  const foot=d.includes('foot')?sv('line',Object.assign({x1:0,y1:0,x2:0,y2:0},st('var(--fig)',5)),svg):null;
  const farArm=hasArm2?sv('polyline',st('var(--fig2)',5),svg):null;
  const farLeg=has2?sv('polyline',st('var(--fig2)',5),svg):null;
  const torso=sv('line',st('var(--fig)',6),svg);
  const leg=sv('polyline',st('var(--fig)',5),svg);
  const arm=sv('polyline',st('var(--fig)',5),svg);
  const head=sv('circle',{r:9,fill:'var(--fig)'},svg);
  const eqs=[];
  if(d.includes('bar'))eqs.push({r:9,w:'W'});
  if(d.includes('db')){eqs.push({r:5.5,w:'W'});if(hasArm2)eqs.push({r:5.5,w:'W2'})}
  const eqEls=eqs.map(q=>sv('circle',{r:q.r,fill:'var(--accent)',style:'filter:drop-shadow(0 0 3px var(--accent))'},svg));
  function render(p){
    torso.setAttribute('x1',p.N[0]);torso.setAttribute('y1',p.N[1]);torso.setAttribute('x2',p.P[0]);torso.setAttribute('y2',p.P[1]);
    leg.setAttribute('points',pts(p.P,p.K,p.A));arm.setAttribute('points',pts(p.N,p.E,p.W));
    if(farLeg)farLeg.setAttribute('points',pts(p.P,p.K2,p.A2));
    if(farArm)farArm.setAttribute('points',pts(p.N,p.E2,p.W2));
    head.setAttribute('cx',p.H[0]);head.setAttribute('cy',p.H[1]);
    eqs.forEach((q,i)=>{const w=p[q.w];eqEls[i].setAttribute('cx',w[0]);eqEls[i].setAttribute('cy',w[1])});
    if(cableTop){cableTop.setAttribute('x1',d.includes('cableTop')?118:136);cableTop.setAttribute('y1',0);cableTop.setAttribute('x2',p.W[0]);cableTop.setAttribute('y2',p.W[1])}
    if(cableH){cableH.setAttribute('x1',p.W[0]);cableH.setAttribute('y1',p.W[1]);cableH.setAttribute('x2',208);cableH.setAttribute('y2',p.W[1]+6)}
    if(foot){foot.setAttribute('x1',p.A[0]);foot.setAttribute('y1',p.A[1]);foot.setAttribute('x2',p.A[0]+12);foot.setAttribute('y2',141)}
  }
  const f={svg,frames:fr,render,playing:!reduce&&opt.frame==null};
  render(opt.frame!=null?fr[opt.frame]:fr[0]);
  if(f.playing)figs.add(f);
  return f;
}
function tick(ts){
  if(!document.hidden)for(const f of figs){if(!f.svg.isConnected){figs.delete(f);continue}if(f.playing)f.render(poseAt(f.frames,vAt(ts,f.frames.length)))}
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* estado e armazenamento (opcional, por navegador) */
let state={cat:0,plan:0,day:0},done={};
try{const s=JSON.parse(localStorage.getItem('tg:state')||'null');if(s&&CATS[s.cat]&&CATS[s.cat].planos[s.plan]&&CATS[s.cat].planos[s.plan].dias[s.day])state=s}catch(e){}
try{done=JSON.parse(localStorage.getItem('tg:done')||'{}')||{}}catch(e){done={}}
const save=()=>{try{localStorage.setItem('tg:state',JSON.stringify(state));localStorage.setItem('tg:done',JSON.stringify(done))}catch(e){}};
const dayKey=()=>state.cat+'/'+state.plan+'/'+state.day;
const isDone=id=>(done[dayKey()]||[]).includes(id);
function toggleDone(id){const k=dayKey(),a=done[k]||[];done[k]=a.includes(id)?a.filter(x=>x!==id):a.concat(id);save()}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const THEMES=[{n:'Verde neon',c:'#2dff7a'},{n:'Rosa neon',c:'#ff2e9a'},{n:'Ciano elétrico',c:'#19e6ff'},{n:'Laranja fogo',c:'#ff7a1a'},{n:'Violeta neon',c:'#a35cff'},{n:'Amarelo limão',c:'#f2ff2e'}];
let theme=0;try{const t=+localStorage.getItem('tg:theme');if(t>=0&&t<THEMES.length)theme=t}catch(e){}
function applyAccent(){document.documentElement.style.setProperty('--accent',THEMES[theme].c)}
function renderThemes(){const box=$('#themes');box.querySelectorAll('.sw').forEach(x=>x.remove());
  THEMES.forEach((t,i)=>{const b=document.createElement('button');b.className='sw';b.style.setProperty('--c',t.c);b.setAttribute('aria-pressed',i===theme);b.setAttribute('aria-label','Tema '+t.n);b.title=t.n;
    b.onclick=()=>{theme=i;try{localStorage.setItem('tg:theme',i)}catch(e){}applyAccent();renderThemes()};box.appendChild(b)})}
function renderCats(){
  const box=$('#cats');box.innerHTML='';
  CATS.forEach((c,i)=>{const b=document.createElement('button');b.className='chip';b.style.setProperty('--c',c.cor);b.setAttribute('aria-pressed',i===state.cat);b.innerHTML='<i></i>'+esc(c.nome);
    b.onclick=()=>{state={cat:i,plan:0,day:0};save();renderCats();renderPlan()};box.appendChild(b)});
}
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.6"/></svg>';
function renderPlan(){
  figs.clear();
  const c=CATS[state.cat],pl=c.planos[state.plan],dy=pl.dias[state.day],root=$('#plan');
  let h='<div class="hero"><h2>'+esc(c.nome)+'</h2><p>'+esc(c.obj)+'</p></div>';
  if(c.planos.length>1)h+='<div class="seg" role="group" aria-label="Plano">'+c.planos.map((p,i)=>'<button data-plan="'+i+'" aria-pressed="'+(i===state.plan)+'">'+esc(p.nome)+'</button>').join('')+'</div>';
  h+='<div class="meta"><div><b>Frequência</b><span>'+esc(pl.freq)+'</span></div><div><b>Duração</b><span>'+esc(pl.dur)+'</span></div><div><b>Nível</b><span>'+esc(pl.nivel)+'</span></div></div>';
  h+='<p class="note">'+esc(pl.nota)+'</p>';
  h+='<div class="days" role="group" aria-label="Dia de treino">'+pl.dias.map((d,i)=>'<button data-day="'+i+'" aria-pressed="'+(i===state.day)+'"><b>'+esc(d.n)+'</b><small>'+esc(d.f)+'</small></button>').join('')+'</div>';
  const nd=dy.ex.filter(e=>isDone(e[0])).length;
  h+='<div class="prog"><div class="bar"><i style="width:'+(nd/dy.ex.length*100)+'%"></i></div><span>'+nd+' de '+dy.ex.length+'</span><button id="reset">Zerar</button></div>';
  h+='<ol class="list" id="list"></ol>';
  root.innerHTML=h;
  root.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{state.plan=+b.dataset.plan;state.day=0;save();renderPlan()});
  root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=+b.dataset.day;save();renderPlan()});
  $('#reset').onclick=()=>{delete done[dayKey()];save();renderPlan()};
  const list=$('#list');
  dy.ex.forEach(([id,s,r,rest])=>{
    const ex=EX[id],li=document.createElement('li');
    li.innerHTML='<article class="card'+(isDone(id)?' done':'')+'"><button class="open" aria-label="Ver como fazer: '+esc(ex.n)+'"><div class="thumb"></div><div><h3>'+esc(ex.n)+'</h3><p class="rx">'+s+' × '+esc(r)+'<small>desc. '+rest+' s</small></p><p class="mus">'+esc(ex.m)+'</p></div></button><button class="check" aria-pressed="'+isDone(id)+'" aria-label="Marcar '+esc(ex.n)+' como feito"><span>'+CHECK+'</span></button></article>';
    li.querySelector('.thumb').appendChild(makeFig(id).svg);
    li.querySelector('.open').onclick=()=>openSheet(id,s,r,rest);
    li.querySelector('.check').onclick=()=>{toggleDone(id);const wasDone=isDone(id);renderPlan();if(wasDone)startRest(rest)};
    list.appendChild(li);
  });
}

/* ficha do exercício */
let lastFocus=null,sheetFig=null;
function openSheet(id,s,r,rest){
  const ex=EX[id],fr=POSES[ex.pose],q=encodeURIComponent(ex.n+' como fazer execução correta');
  const names=fr.length===2?['Início','Fim']:fr.map((_,i)=>i===0?'Início':i===fr.length-1?'Fim':'Meio');
  const panel=$('#panel');
  panel.innerHTML='<div class="ph"><h2 id="sheetTitle">'+esc(ex.n)+'</h2><button class="x" id="close" aria-label="Fechar">×</button></div>'
   +'<div class="stage" id="stage"></div>'
   +'<div class="frames" id="frames"></div>'
   +'<div class="tags"><span class="rxp">'+s+' × '+esc(r)+' · desc. '+rest+' s</span><span>'+esc(ex.m)+'</span><span>'+esc(ex.q)+'</span></div>'
   +'<h4>Como fazer</h4><ol>'+ex.p.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol>'
   +'<div class="err"><b>Erro comum</b>'+esc(ex.e)+'</div>'
   +'<div class="acts"><a class="btn pri" href="https://www.youtube.com/results?search_query='+q+'" target="_blank" rel="noopener">Ver vídeo no YouTube</a><a class="btn" href="https://www.google.com/search?tbm=isch&q='+q+'" target="_blank" rel="noopener">Ver imagens</a><button class="btn'+(isDone(id)?' on':'')+'" id="markDone">'+(isDone(id)?'Feito ✓':'Marcar como feito')+'</button></div>';
  sheetFig=makeFig(id);$('#stage').appendChild(sheetFig.svg);
  if(!reduce){const pb=document.createElement('button');pb.className='play';pb.textContent='Pausar';pb.onclick=()=>{sheetFig.playing=!sheetFig.playing;pb.textContent=sheetFig.playing?'Pausar':'Continuar'};$('#stage').appendChild(pb)}
  fr.forEach((_,i)=>{const d=document.createElement('div');d.className='frame';d.innerHTML='<div class="img"></div><small>'+names[i]+'</small>';d.querySelector('.img').appendChild(makeFig(id,{frame:i}).svg);$('#frames').appendChild(d)});
  $('#close').onclick=closeSheet;
  $('#markDone').onclick=()=>{const was=isDone(id);toggleDone(id);renderPlan();closeSheet();if(!was)startRest(rest)};
  lastFocus=document.activeElement;$('#sheet').hidden=false;document.body.style.overflow='hidden';panel.scrollTop=0;$('#close').focus();
}
function closeSheet(){$('#sheet').hidden=true;document.body.style.overflow='';if(sheetFig){sheetFig.playing=false;figs.delete(sheetFig);sheetFig=null}if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
$('#backdrop').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* cronômetro de descanso */
let tId=null,tEnd=0;
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.35)}catch(e){}try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
function stopRest(){clearInterval(tId);tId=null;$('#timer').classList.remove('run')}
function startRest(sec){
  stopRest();tEnd=Date.now()+sec*1000;$('#timer').classList.add('run');$('#clock').textContent=fmt(sec);
  tId=setInterval(()=>{const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));$('#clock').textContent=fmt(left);if(left<=0){stopRest();beep()}},250);
}
document.querySelectorAll('#timer .pick[data-s]').forEach(b=>b.onclick=()=>startRest(+b.dataset.s));
$('#skip').onclick=stopRest;

applyAccent();renderThemes();renderCats();renderPlan();
if("serviceWorker" in navigator)window.addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}});
</script>
